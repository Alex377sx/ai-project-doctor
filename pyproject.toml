[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-doctor"
version = "0.1.0"
description = "A fast, local health report for software repositories."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AI Project Doctor contributors" }]

[project.scripts]
project-doctor = "project_doctor.__main__:main"
